services:
  postgres:
    image: postgres:16-alpine
    container_name: backend-challenge-go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: ${DB_NAME:-backend_challenge}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-backend_challenge}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
